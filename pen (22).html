<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pen</title>
<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #02050a;
  color: #55dfff;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

.jarvis {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(circle at center, #062438 0%, #02050a 45%, #000 100%);
}

.hud {
  width: 100%;
  max-width: 500px;
  min-height: 100vh;
  text-align: center;
  padding: 30px 20px;
  position: relative;
}

.title {
  font-size: 32px;
  letter-spacing: 8px;
  font-weight: bold;
  text-shadow: 0 0 15px #00d9ff;
}

.status {
  margin-top: 10px;
  font-size: 13px;
  letter-spacing: 4px;
}

.core {
  width: 230px;
  height: 230px;
  margin: 70px auto 35px;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
}

.orb {
  width: 85px;
  height: 85px;
  border-radius: 50%;
  background: radial-gradient(circle, white 0%, #48eaff 25%, #008cff 60%, #003b66 100%);
  box-shadow:
    0 0 20px #00d9ff,
    0 0 50px #008cff,
    0 0 100px #0066ff;
  animation: pulse 2s infinite;
}

.ring {
  position: absolute;
  border: 2px solid #00cfff;
  border-radius: 50%;
  box-shadow: 0 0 15px #00cfff;
}

.ring1 {
  width: 130px;
  height: 130px;
  animation: spin 5s linear infinite;
}

.ring2 {
  width: 180px;
  height: 180px;
  border-style: dashed;
  animation: spinReverse 8s linear infinite;
}

.ring3 {
  width: 225px;
  height: 225px;
  opacity: .45;
  animation: spin 12s linear infinite;
}

.clock {
  font-size: 25px;
  letter-spacing: 5px;
  margin: 20px;
}

.response {
  min-height: 45px;
  margin: 25px 0;
  color: #d8faff;
}

button {
  border: 1px solid #00d9ff;
  background: rgba(0, 180, 255, .12);
  color: #65eaff;
  padding: 15px 25px;
  border-radius: 30px;
  font-size: 15px;
  font-weight: bold;
  box-shadow: 0 0 20px rgba(0, 200, 255, .4);
}

button:active {
  transform: scale(.96);
}

@keyframes pulse {
  0%, 100% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.15);
  }
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes spinReverse {
  from { transform: rotate(360deg); }
  to { transform: rotate(0deg); }
}
</style>
</head>
<body>
<div class="jarvis">
  <div class="hud">
    <div class="title">J.A.R.V.I.S.</div>
    <div class="status" id="status">SISTEMA ONLINE</div>

    <div class="core" id="core">
      <div class="ring ring1"></div>
      <div class="ring ring2"></div>
      <div class="ring ring3"></div>
      <div class="orb"></div>
    </div>

    <div class="clock" id="clock">00:00:00</div>

    <div class="response" id="response">
      Aguardando comando...
    </div>

    <button id="mic">🎙️ FALAR COM JARVIS</button>
  </div>
</div>
<script>
const clock = document.getElementById("clock");
const status = document.getElementById("status");
const response = document.getElementById("response");
const mic = document.getElementById("mic");
const core = document.getElementById("core");


// ==========================
// RELÓGIO
// ==========================

function atualizarRelogio() {
  const agora = new Date();

  clock.textContent = agora.toLocaleTimeString("pt-BR", {
    hour12: false
  });
}

setInterval(atualizarRelogio, 1000);
atualizarRelogio();


// ==========================
// VOZ DO JARVIS
// ==========================

function falar(texto) {

  response.textContent = texto;

  if ("speechSynthesis" in window) {

    speechSynthesis.cancel();

    const voz = new SpeechSynthesisUtterance(texto);

    voz.lang = "pt-BR";
    voz.rate = 0.82;
    voz.pitch = 0.65;
    voz.volume = 1;

    speechSynthesis.speak(voz);
  }
}


// ==========================
// RECONHECIMENTO DE VOZ
// ==========================

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let reconhecimento = null;

if (SpeechRecognition) {

  reconhecimento = new SpeechRecognition();

  reconhecimento.lang = "pt-BR";
  reconhecimento.continuous = false;
  reconhecimento.interimResults = false;
  reconhecimento.maxAlternatives = 1;


  reconhecimento.onstart = function() {

    status.textContent = "OUVINDO...";
    response.textContent = "Pode falar...";
    core.style.transform = "scale(1.15)";

  };


  reconhecimento.onresult = function(event) {

    const texto =
      event.results[0][0].transcript.trim();

    console.log("VOCÊ DISSE:", texto);

    status.textContent = "ENTENDI";

    response.textContent =
      "Você disse: " + texto;

    core.style.transform = "scale(1.08)";


    const frase = texto.toLowerCase();


    // ==========================
    // RESPOSTAS
    // ==========================

    if (
      frase.includes("oi") ||
      frase.includes("olá")
    ) {

      falar("Olá. Como posso ajudá-lo?");

    }

    else if (
      frase.includes("quem é você") ||
      frase.includes("quem você é")
    ) {

      falar("Eu sou JARVIS, seu assistente virtual.");

    }

    else if (
      frase.includes("que horas são") ||
      frase.includes("horas")
    ) {

      const agora = new Date();

      const hora =
        agora.toLocaleTimeString("pt-BR", {
          hour: "2-digit",
          minute: "2-digit"
        });

      falar("Agora são " + hora + ".");

    }

    else if (
      frase.includes("como você está")
    ) {

      falar("Todos os sistemas estão funcionando normalmente.");

    }

    else if (
      frase.includes("obrigado") ||
      frase.includes("obrigada")
    ) {

      falar("Disponha.");

    }

    else {

      falar("Entendi. Você disse: " + texto);

    }

  };


  reconhecimento.onerror = function(event) {

    console.log("ERRO DO RECONHECIMENTO:", event.error);

    status.textContent = "TENTE NOVAMENTE";

    core.style.transform = "scale(1)";


    if (event.error === "no-speech") {

      response.textContent =
        "Não ouvi sua voz. Fale um pouco mais perto.";

    }

    else if (event.error === "not-allowed") {

      response.textContent =
        "Permissão do microfone bloqueada.";

    }

    else {

      response.textContent =
        "Erro: " + event.error;

    }

  };


  reconhecimento.onend = function() {

    status.textContent = "SISTEMA ONLINE";

    core.style.transform = "scale(1)";

  };

}


// ==========================
// BOTÃO
// ==========================

mic.addEventListener("click", function() {

  if (!reconhecimento) {

    response.textContent =
      "Reconhecimento de voz não disponível.";

    return;

  }


  speechSynthesis.cancel();


  try {

    reconhecimento.start();

  } catch (erro) {

    console.log("Reconhecimento já iniciado.");

  }

});
</script>
</body>
</html>
